services:
  app:
    image: ${APP_IMAGE:-gym-portfolio:local}
    restart: unless-stopped
    volumes:
      - gym-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  proxy:
    image: caddy:2-alpine
    labels:
      gym.caddy.config-hash: ${CADDY_CONFIG_HASH:-local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  gym-data:
  caddy-data:
  caddy-config:
