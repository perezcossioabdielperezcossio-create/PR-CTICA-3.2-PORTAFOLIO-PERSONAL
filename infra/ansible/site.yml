---
- name: Configurar y desplegar el portafolio
  hosts: gym
  become: true
  gather_facts: false
  vars:
    project_directory: /opt/gym-portfolio
    source_directory: "{{ playbook_dir }}/../.."
    domain: "{{ lookup('ansible.builtin.env', 'SITE_DOMAIN') }}"
    vnc_password: "{{ lookup('ansible.builtin.env', 'VNC_PASSWORD') }}"
    admin_cidr: "{{ lookup('ansible.builtin.env', 'ADMIN_CIDR') }}"
  pre_tasks:
    - name: Esperar el inicio del servidor
      ansible.builtin.wait_for_connection:
        timeout: 420

    - name: Esperar que cloud-init termine
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Obtener datos de Ubuntu
      ansible.builtin.setup:

    - name: Comprobar datos de despliegue
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'APP_IMAGE') is match('^[a-z0-9._/-]+@sha256:[0-9a-f]{64}$')
          - domain == '' or domain is match('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')
          - vnc_password | length >= 6 and vnc_password | length <= 8
      no_log: true

  tasks:
    - name: Instalar dependencias de Ubuntu
      ansible.builtin.apt:
        name: [ca-certificates, git, ufw, iptables]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Crear directorio de llaves APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Descargar llave de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Configurar repositorio de Docker para Ubuntu 24.04
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable
        filename: docker
        state: present

    - name: Instalar Docker Engine y Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present

    - name: Habilitar Docker y conservar su gestión de iptables
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Permitir HTTP y HTTPS en UFW
      ansible.builtin.command: "ufw allow {{ item }}/tcp"
      loop: [80, 443]
      register: ufw_web
      changed_when: "'Skipping' not in ufw_web.stdout"

    - name: Permitir SSH directo desde la red administrativa
      ansible.builtin.command: "ufw allow from {{ admin_cidr }} to any port 22 proto tcp"
      register: ufw_ssh
      changed_when: "'Skipping' not in ufw_ssh.stdout"
      when: admin_cidr | length > 0

    - name: Denegar conexiones entrantes por defecto
      ansible.builtin.command: ufw default deny incoming
      changed_when: false

    - name: Habilitar UFW
      ansible.builtin.command: ufw --force enable
      changed_when: false

    - name: Crear el directorio de despliegue
      ansible.builtin.file:
        path: "{{ project_directory }}"
        state: directory
        mode: '0755'

    - name: Copiar los archivos del despliegue
      ansible.builtin.copy:
        src: "{{ source_directory }}/{{ item }}"
        dest: "{{ project_directory }}/{{ item }}"
        mode: '0644'
      loop: [compose.yml, Caddyfile]

    - name: Guardar la referencia inmutable de la imagen
      ansible.builtin.copy:
        dest: "{{ project_directory }}/.env"
        content: |
          APP_IMAGE={{ lookup('ansible.builtin.env', 'APP_IMAGE') }}
          SITE_ADDRESS={{ domain | default(':80', true) }}
          CADDY_CONFIG_HASH={{ lookup('ansible.builtin.file', source_directory ~ '/Caddyfile') | hash('sha256') }}
        mode: '0644'

    - name: Crear credenciales temporales para descargar desde Docker Hub
      ansible.builtin.tempfile:
        state: directory
      register: docker_config

    - name: Descargar y desplegar
      environment:
        DOCKER_CONFIG: "{{ docker_config.path }}"
      block:
        - name: Autenticar Docker Hub
          ansible.builtin.command:
            argv:
              - docker
              - login
              - --username
              - "{{ lookup('ansible.builtin.env', 'DOCKERHUB_USERNAME') }}"
              - --password-stdin
            stdin: "{{ lookup('ansible.builtin.env', 'DOCKERHUB_TOKEN') }}"
          no_log: true
          changed_when: false

        - name: Descargar imágenes
          ansible.builtin.command: docker compose pull
          args:
            chdir: "{{ project_directory }}"
          changed_when: false

        - name: Levantar servicios y esperar disponibilidad
          ansible.builtin.command: docker compose up -d --no-build --wait --wait-timeout 120
          args:
            chdir: "{{ project_directory }}"
          register: compose_up
          changed_when: "'Created' in compose_up.stderr or 'Started' in compose_up.stderr"
      always:
        - name: Borrar credenciales temporales
          ansible.builtin.file:
            path: "{{ docker_config.path }}"
            state: absent

    - name: Instalar y habilitar VNC
      ansible.builtin.include_tasks: vnc.yml
